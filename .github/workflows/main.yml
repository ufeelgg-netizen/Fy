name: Extract ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          shopt -s dotglob
          ITEMS=(extracted/*)

          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            SOURCE="${ITEMS[0]}"
          else
            SOURCE="extracted"
          fi

          for item in "$SOURCE"/*; do
            name=$(basename "$item")

            if [ "$name" != ".git" ] && [ "$name" != ".github" ]; then
              rm -rf "./$name"
              cp -R "$item" .
            fi
          done

          rm -rf extracted

      - name: Remove ZIP
        run: |
          rm -f ./*.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Extract website project"
            git push
          fi
