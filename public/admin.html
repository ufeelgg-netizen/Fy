<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإدارة</title><link rel="stylesheet" href="/style.css"></head><body><main class="admin"><div class="top"><h1>لوحة الإدارة</h1><button class="btn-small" onclick="logout()">تسجيل الخروج</button></div><div id="stats" class="stats"></div><section class="card" style="margin-top:20px"><h2>طلبات الداعمين</h2><div style="overflow:auto"><table><thead><tr><th>المستخدم</th><th>المجالات</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="helpers"></tbody></table></div></section><section class="card" style="margin-top:20px"><h2>البلاغات</h2><div style="overflow:auto"><table><thead><tr><th>المبلّغ</th><th>المبلّغ عليه</th><th>السبب</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="reports"></tbody></table></div></section></main><script src="/app.js"></script><script>
(async()=>{try{const me=await loadMe();if(!me||me.role!=="ADMIN")return location.href="/login.html";loadAll()}catch{location.href="/login.html"}})();
async function loadAll(){const s=await api("/api/admin/stats");stats.innerHTML=Object.entries(s).map(([k,v])=>'<div class="stat"><b>'+v+'</b>'+k+'</div>').join("");const h=await api("/api/admin/helpers");helpers.innerHTML=h.helpers.map(x=>'<tr><td>'+esc(x.display_name)+'</td><td>'+esc(x.categories)+'</td><td>'+x.verification+'</td><td><button class="btn-small" onclick="review('+x.id+',\'APPROVED\')">قبول</button> <button class="btn-small" onclick="review('+x.id+',\'REJECTED\')">رفض</button></td></tr>').join("");const r=await api("/api/admin/reports");reports.innerHTML=r.reports.map(x=>'<tr><td>'+esc(x.reporter_name)+'</td><td>'+esc(x.reported_name)+'</td><td>'+esc(x.reason)+'</td><td>'+x.status+'</td><td><button class="btn-small" onclick="closeReport('+x.id+')">إغلاق</button></td></tr>').join("")}
async function review(id,status){await api("/api/admin/helpers/"+id,{method:"PATCH",body:JSON.stringify({verification:status})});loadAll()}
async function closeReport(id){await api("/api/admin/reports/"+id,{method:"PATCH",body:JSON.stringify({status:"CLOSED"})});loadAll()}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
