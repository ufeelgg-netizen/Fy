<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب</title><link rel="stylesheet" href="/style.css"></head><body><main class="form-page"><section class="panel"><a class="back" href="/">← الرئيسية</a><h1>إنشاء حساب</h1><p>اختر طريقة استخدامك للمساحة.</p><form onsubmit="register(event)"><label>اسم مستعار</label><input name="displayName" maxlength="40" required><label>البريد الإلكتروني</label><input name="email" type="email" required><label>كلمة المرور</label><input name="password" type="password" minlength="8" required><label>أريد</label><select name="mode"><option value="USER">أحتاج مساعدة</option><option value="HELPER">تقديم الدعم</option></select><div class="notice">لا تشارك بيانات حساسة. هذه المنصة تحتاج إعدادات إضافية لحماية القاصرين قبل الإطلاق العام.</div><div class="error"></div><button class="full">إنشاء الحساب</button></form></section></main><script src="/app.js"></script></body></html>
