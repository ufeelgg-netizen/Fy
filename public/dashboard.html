<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساحتي</title><link rel="stylesheet" href="/style.css"></head><body><main class="dashboard"><div class="top"><div><small>مساحتي</small><h1 id="welcome">...</h1></div><button class="btn-small" onclick="logout()">تسجيل الخروج</button></div><div id="notice" class="notice"></div><section class="card"><h2>الداعمون المتاحون</h2><div id="helpers" class="grid"></div></section><section class="card" style="margin-top:15px"><h2>محادثاتي</h2><div id="convs"></div></section></main><script src="/app.js"></script><script>
(async()=>{const me=await loadMe();if(!me){location.href="/login.html";return}welcome.textContent="مرحبًا، "+me.displayName; if(me.role==="ADMIN")notice.innerHTML='<a href="/admin.html">فتح لوحة الإدارة →</a>'; else notice.textContent="اختر شخصًا داعمًا لبدء محادثة."; 
try{const d=await api("/api/helpers");helpers.innerHTML=d.helpers.map(h=>'<article class="card helper"><div class="avatar">✦</div><div class="helper-info"><b>'+esc(h.displayName)+'</b><br><small>'+esc(h.bio||"شخص داعم")+'</small></div><button class="btn-small" onclick="startChat('+h.id+')">بدء المحادثة</button></article>').join("")||"<p>لا يوجد داعمون متاحون حاليًا.</p>";loadConvs()}catch(e){helpers.innerHTML='<p>تعذر تحميل الداعمين.</p>'}})();
async function startChat(id){try{const d=await api("/api/conversations",{method:"POST",body:JSON.stringify({helperId:id})});location.href="/chat.html?id="+d.conversation.id}catch(e){alert(e.message)}}
async function loadConvs(){const d=await api("/api/conversations");convs.innerHTML=d.conversations.map(c=>'<p><a href="/chat.html?id='+c.id+'">محادثة مع '+esc(c.requester_id===(window.__uid||-1)?c.helper_name:c.requester_name)+' — '+c.status+'</a></p>').join("")||"<p>لا توجد محادثات.</p>"}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
