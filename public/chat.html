<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحادثة</title><link rel="stylesheet" href="/style.css"></head><body><main class="chat"><a href="/dashboard.html">← مساحتي</a><h1 id="title">المحادثة</h1><div id="messages" class="messages"></div><form class="send" onsubmit="send(event)"><input id="content" maxlength="2000" placeholder="اكتب رسالة باحترام..." required><button class="full">إرسال</button></form><div style="display:flex;gap:8px;margin-top:10px"><button class="btn-small" onclick="endChat()">إنهاء المحادثة</button><button class="btn-small" onclick="report()">إبلاغ</button></div></main><script src="/app.js"></script><script>
const id=new URLSearchParams(location.search).get("id");let current;
async function load(){try{const d=await api("/api/conversations/"+id+"/messages");current=d.conversation;title.textContent="محادثة مع "+(current.requester_name);messages.innerHTML=d.messages.map(m=>'<div class="msg '+(m.sender_id===current.requester_id?'':'mine')+'"><b>'+esc(m.sender_name)+'</b><br>'+esc(m.content)+'</div>').join("");messages.scrollTop=messages.scrollHeight}catch(e){alert(e.message);location.href="/dashboard.html"}}
async function send(e){e.preventDefault();const v=content.value.trim();if(!v)return;try{await api("/api/conversations/"+id+"/messages",{method:"POST",body:JSON.stringify({content:v})});content.value="";load()}catch(e){alert(e.message)}}
async function endChat(){if(confirm("إنهاء المحادثة؟")){await api("/api/conversations/"+id+"/end",{method:"POST"});load()}}
async function report(){const reason=prompt("سبب الإبلاغ:");if(reason)await api("/api/reports",{method:"POST",body:JSON.stringify({conversationId:Number(id),reason})});alert("تم إرسال البلاغ")}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}load();setInterval(load,4000);
</script></body></html>
